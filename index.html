<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#f2f0ed"><title>yötön yö studio — touch study 02</title><style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f0ed;font-family:Arial,'Helvetica Neue',sans-serif}canvas{display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none;color:#34383d}header{position:absolute;left:25px;top:max(25px,env(safe-area-inset-top));font-size:19px;letter-spacing:.09em;line-height:1.4;font-weight:400}header small{display:block;font-size:9px;letter-spacing:.24em;margin-top:8px;color:#8d9297}footer{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:11px;letter-spacing:.18em;color:#7d8188}#controls{position:absolute;right:18px;top:max(27px,env(safe-area-inset-top));display:flex;gap:9px;pointer-events:auto}button{border:1px solid #c9c9c9;border-radius:99px;background:#ffffffb9;color:#555;padding:9px 12px;font-size:11px;cursor:pointer}button.active{background:#d9e5f0;border-color:#9db6cb}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f2f0ed;color:#777;font-size:13px;letter-spacing:.1em;z-index:5}#error{display:none;position:fixed;left:15px;right:15px;bottom:80px;padding:12px;background:#fff2e9;color:#85472d;font-size:12px;z-index:6}
</style></head><body><div id="loading">loading soft things…</div><div id="error"></div><div id="ui"><header>yötön yö studio<small>TOUCH STUDY — 02</small></header><div id="controls"><button id="reset">reset</button><button id="color">color</button></div><footer>touch · drag · release</footer></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const loading=document.getElementById('loading'),err=document.getElementById('error');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color('#f2f0ed');const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(0,0,15);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.42;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xc8b4ae,2.3));const key=new THREE.DirectionalLight(0xffffff,3.0);key.position.set(-3,7,9);scene.add(key);const rim=new THREE.PointLight(0xb9d9ff,90);rim.position.set(5,2,4);scene.add(rim);
const group=new THREE.Group();scene.add(group);
// Original hand-drawn y outline: left rounded arm, shallow notch, shorter right arm, bent stem.
const s=new THREE.Shape();s.moveTo(-.64,-1.66);s.bezierCurveTo(-1.10,-1.62,-1.24,-1.25,-1.13,-.87);s.bezierCurveTo(-1.01,-.43,-.90,-.10,-1.10,.26);s.bezierCurveTo(-1.32,.61,-1.30,1.11,-.98,1.43);s.bezierCurveTo(-.71,1.72,-.25,1.75,.02,1.44);s.bezierCurveTo(.27,1.14,.44,1.04,.67,1.29);s.bezierCurveTo(.97,1.59,1.42,1.53,1.60,1.20);s.bezierCurveTo(1.86,.74,1.56,.40,1.17,.12);s.bezierCurveTo(.85,-.10,.55,-.41,.34,-.80);s.bezierCurveTo(.04,-1.35,-.18,-1.66,-.64,-1.66);
// Subdivide every triangle (including the large front/back cap triangles).
// This prevents the original coarse triangulation from showing as diamond facets on touch.
function subdivideTriangles(input,levels=2){
  let arr=Array.from(input.index?input.toNonIndexed().attributes.position.array:input.attributes.position.array);
  for(let level=0;level<levels;level++){
    const next=[];
    const tri=(a,b,c)=>next.push(...a,...b,...c);
    for(let i=0;i<arr.length;i+=9){
      const a=arr.slice(i,i+3),b=arr.slice(i+3,i+6),c=arr.slice(i+6,i+9);
      const mid=(u,v)=>[(u[0]+v[0])*.5,(u[1]+v[1])*.5,(u[2]+v[2])*.5];
      const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
      tri(a,ab,ca);tri(ab,b,bc);tri(ca,bc,c);tri(ab,bc,ca);
    }
    arr=next;
  }
  const out=new THREE.BufferGeometry();out.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  out.computeVertexNormals();input.dispose();return out;
}
let geo=new THREE.ExtrudeGeometry(s,{depth:.55,steps:1,bevelEnabled:true,bevelThickness:.34,bevelSize:.32,bevelSegments:12,curveSegments:32});geo.center();geo=subdivideTriangles(geo,2);const base=Float32Array.from(geo.attributes.position.array);const disp=new Float32Array(base.length);const vel=new Float32Array(base.length);const mat=new THREE.MeshPhysicalMaterial({color:0xfff4e5,metalness:0,roughness:.25,transmission:.23,thickness:1.5,ior:1.33,clearcoat:.85,clearcoatRoughness:.18});const body=new THREE.Mesh(geo,mat);group.add(body);
const eyes=[];const eyeMat=new THREE.MeshStandardMaterial({color:0x202026,roughness:.21});function eye(x,y){const m=new THREE.Mesh(new THREE.SphereGeometry(.072,20,16),eyeMat);m.position.set(x,y,.66);m.scale.set(.8,1.16,.55);group.add(m);eyes.push(m)}eye(-.54,.58);eye(-.10,.48);
// Ground shadow as transparent layered ellipses.
const shadowMat=new THREE.MeshBasicMaterial({color:0xb7a7a2,transparent:true,opacity:.075,depthWrite:false});for(let i=0;i<8;i++){const sh=new THREE.Mesh(new THREE.CircleGeometry(1,48),shadowMat.clone());sh.material.opacity=.018;sh.scale.set(1.7+i*.12,.22+i*.04,1);sh.position.set(.05,-2.03,-1.1-i*.001);group.add(sh)}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let pressed=false,hit=new THREE.Vector3(),prev=new THREE.Vector2(),palette=0,rotVel=0,phase=0;const colors=[0xfff4e5,0xb7d8ed,0xecc8dc,0xc5dfcf,0xf5d9a1];function ndc(e){pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;return pointer}function intersect(e){ray.setFromCamera(ndc(e),camera);const hits=ray.intersectObject(body);return hits.length?hits[0].point:null}function poke(p,strength=1){const local=body.worldToLocal(p.clone());const pos=geo.attributes.position;for(let i=0;i<pos.count;i++){const j=i*3,dx=base[j]-local.x,dy=base[j+1]-local.y;const d2=dx*dx+dy*dy;
  // A broad, smooth Gaussian indentation; only the visible front surface moves.
  const front=THREE.MathUtils.smoothstep(base[j+2],.03,.44);
  const w=Math.exp(-d2/(2*.55*.55))*front;
  vel[j+2]-=w*.105*strength;}rotVel+=(Math.random()-.5)*.015;}
renderer.domElement.addEventListener('pointerdown',e=>{pressed=true;renderer.domElement.setPointerCapture(e.pointerId);prev.set(e.clientX,e.clientY);const p=intersect(e);if(p){hit.copy(p);poke(p,1.7)} });renderer.domElement.addEventListener('pointermove',e=>{if(!pressed)return;const dx=e.clientX-prev.x,dy=e.clientY-prev.y;prev.set(e.clientX,e.clientY);rotVel+=dx*.00007;const p=intersect(e);if(p)poke(p,.26+Math.min(Math.hypot(dx,dy)/30,.8));});renderer.domElement.addEventListener('pointerup',()=>pressed=false);renderer.domElement.addEventListener('pointercancel',()=>pressed=false);
document.getElementById('reset').onclick=()=>{for(let i=0;i<disp.length;i++){disp[i]=0;vel[i]=0}group.rotation.z=0;rotVel=0};document.getElementById('color').onclick=e=>{palette=(palette+1)%colors.length;mat.color.setHex(colors[palette]);e.currentTarget.classList.toggle('active',palette!==0)};
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04),step=dt*60;phase+=dt;const a=geo.attributes.position.array;for(let i=0;i<a.length;i++){vel[i]+=(-disp[i]*.085-vel[i]*.18)*step;disp[i]+=vel[i]*step;disp[i]=THREE.MathUtils.clamp(disp[i],-.33,.33);a[i]=base[i]+disp[i];}geo.attributes.position.needsUpdate=true;geo.computeVertexNormals();group.rotation.z+=rotVel*step;rotVel*=Math.pow(.955,step);body.rotation.y=Math.sin(phase*.58)*.045;body.position.y=Math.sin(phase*1.45)*.025;renderer.render(scene,camera)}function resize(){camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<650?17.7:14;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}window.addEventListener('resize',resize);resize();loading.remove();frame();
}catch(e){loading.remove();err.style.display='block';err.textContent='3Dを読み込めませんでした。インターネット接続を確認してください: '+e.message;console.error(e)}
</script></body></html>
